# CI: build, typecheck, unit suite on Node 22/24, plus a real-host boot smoke
# — on every push to main, every pull request, and a daily schedule.
#
# The @deepseek-ai/* devDeps are pinned exactly to 0.1.2-alpha.3 so installs
# resolve a real published surface, but typecheck/tests run against the GLOBAL
# dsh CLI's own closure (scripts/link-dsh-closure.mjs re-points every
# @deepseek-ai/* at it) — one cordis in the type graph, and the gate tracks
# the alpha line the same way the running host does. The smoke job boots a
# scratch profile with the plugin mounted via the real dsh CLI
# (scripts/smoke-boot.mjs) so "loads under real cordis" is a gate, not a hope.
#
# The daily schedule is the rolling early-warning: an alpha-line drift that
# breaks this plugin turns the scheduled run red without anyone re-pinning.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 02:37 UTC — catches upstream dsh alpha drift without hand-chasing.
    - cron: '37 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & Test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The shipped engines floor plus current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm-lock.yaml is committed and MUST be regenerated in the same
          # commit as any package.json change — CI installs frozen and fails
          # fast otherwise (the dsh-tui-pi v1.0.5 lesson).
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (alpha line)
        run: npm install -g @deepseek-ai/dsh@alpha --no-audit --no-fund

      # Re-point every @deepseek-ai/* at the CLI's own closure so typecheck
      # and the unit suite see exactly one copy of each host package.
      - name: Link @deepseek-ai/* to the dsh closure
        run: node scripts/link-dsh-closure.mjs

      # Tests import lib/ and there is no pretest hook, so build explicitly.
      - name: Build
        run: pnpm build

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

  smoke:
    name: Boot smoke (real dsh host)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (alpha line)
        run: npm install -g @deepseek-ai/dsh@alpha --no-audit --no-fund

      - name: Link @deepseek-ai/* to the dsh closure
        run: node scripts/link-dsh-closure.mjs

      - name: Build
        run: pnpm build

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
