# CI: build, typecheck, unit suite on Node 22/24, plus a real-host boot smoke
# — on every push to main, every pull request, and a daily schedule.
#
# The @deepseek-ai/* devDeps are pinned to the current wave line (0.2.1-rc.5)
# so installs resolve a real published surface, but typecheck/tests run against
# the DSH_CLOSURE_DIR override or the GLOBAL dsh CLI's own closure
# (scripts/link-dsh-closure.mjs re-points every @deepseek-ai/* at it) — one
# cordis in the type graph. The smoke job boots a scratch profile with the
# plugin mounted via the real dsh CLI (scripts/smoke-boot.mjs) so "loads under
# real cordis" is a gate, not a hope.
#
# 2026-11-04 incident pin: the closure supply is PINNED to 0.2.1-rc.5 (both
# jobs) instead of resolving newest-of(latest,next) at run time — upstream's
# `next` (0.2.2-rc.1) shipped an incomplete wave (@deepseek-ai/dsh-plan-mode@
# 0.2.2-rc.1 is 404 on the registry) that breaks this 0.2.1-rc.5-era source.
# Restore the rolling newest-of(latest,next) resolution once the 0.2.2 wave is
# complete and the source is adapted — the daily schedule becomes the rolling
# early-warning again then. Follow-up tracked in CHANGELOG "Unreleased".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 02:37 UTC — catches upstream dsh rc/stable drift without hand-chasing.
    - cron: '37 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & Test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The shipped engines floor plus current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm-lock.yaml is committed and MUST be regenerated in the same
          # commit as any package.json change — CI installs frozen and fails
          # fast otherwise (the dsh-tui-pi v1.0.5 lesson).
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (PINNED 0.2.1-rc.5 closure wave — 2026-11-04 incident pin)
        run: |
          # 2026-11-04 incident pin (suspends the rolling newest-of(latest,next)
          # resolution): upstream `next` moved to 0.2.2-rc.1 and the roller
          # picked it (run 41814294685). That wave installs but is INCOMPLETE
          # and breaking for this 0.2.1-rc.5-era source:
          #   - PromptPresentation lost the `tools` property
          #     (src/delegation-guidance.ts reads assembly.tools),
          #   - CodeRunFailedError moved to the new
          #     @deepseek-ai/dsh-tool-executor-ptc (src/ptc/runner.ts imports
          #     it from @deepseek-ai/dsh-tools),
          #   - @deepseek-ai/dsh-plan-mode@0.2.2-rc.1 is 404 on the registry
          #     (the package tops out at 0.2.2-alpha.3), so the full 0.2.2
          #     tower cannot even be installed locally to stage a migration
          #     patch.
          # Policy: an upstream incident is turned green in the same round by
          # pinning the closure supply to the last COMPLETE published wave.
          # Follow-up (CHANGELOG "Unreleased"): once the 0.2.2 wave completes
          # and the source is adapted, restore the rolling newest-of(latest,next)
          # resolution (recoverable from this file's git history) and ride the
          # wave again.
          DSH_VERSION="0.2.1-rc.5"
          # Same wave-pinned closure install as before: the pinned version's
          # own @deepseek-ai/* ranges are clamped to their base versions via
          # npm overrides, so tilde/caret ranges cannot float into another
          # tower (the ^0.1.5-rc.2 float trap on record).
          DSH_DIR="${RUNNER_TEMP:-/tmp}/dsh-cli-install"
          install_dsh() {
            local ver="$1" dir="$2"
            node -e '
              const { execFileSync } = require("node:child_process")
              const { writeFileSync, mkdirSync } = require("node:fs")
              const [ver, dir] = process.argv.slice(1)
              const deps = JSON.parse(execFileSync("npm", ["view", `@deepseek-ai/dsh@${ver}`, "dependencies", "--json"], { encoding: "utf8" }))
              const overrides = {}
              for (const [name, range] of Object.entries(deps ?? {})) {
                if (name.startsWith("@deepseek-ai/") && /^[~^]/.test(range)) overrides[name] = range.replace(/^[~^]/, "")
              }
              mkdirSync(dir, { recursive: true })
              writeFileSync(`${dir}/package.json`, JSON.stringify({
                name: "dsh-ci-install",
                private: true,
                dependencies: { "@deepseek-ai/dsh": ver },
                overrides,
              }, null, 2))
            ' "$ver" "$dir"
            (cd "$dir" && npm install --no-audit --no-fund >/dev/null)
          }
          echo "dsh closure: ${DSH_VERSION} (pinned)"
          if ! install_dsh "$DSH_VERSION" "$DSH_DIR"; then
            echo "::error:: pinned closure wave dsh@${DSH_VERSION} won't install — the wave left the registry; re-pin to the next complete wave"
            exit 1
          fi
          # Later steps (link-dsh-closure, boot smoke) use the scratch CLI.
          echo "${DSH_DIR}/node_modules/.bin" >> "$GITHUB_PATH"
          echo "DSH_CLOSURE_DIR=${DSH_DIR}/node_modules/@deepseek-ai" >> "$GITHUB_ENV"

      # Re-point every @deepseek-ai/* at the CLI's own closure so typecheck
      # and the unit suite see exactly one copy of each host package.
      - name: Link @deepseek-ai/* to the dsh closure
        run: node scripts/link-dsh-closure.mjs

      # Tests import lib/ and there is no pretest hook, so build explicitly.
      - name: Build
        run: pnpm build

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

  smoke:
    name: Boot smoke (real dsh host)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (PINNED 0.2.1-rc.5 closure wave — 2026-11-04 incident pin)
        run: |
          # 2026-11-04 incident pin (suspends the rolling newest-of(latest,next)
          # resolution): upstream `next` moved to 0.2.2-rc.1 and the roller
          # picked it (run 41814294685). That wave installs but is INCOMPLETE
          # and breaking for this 0.2.1-rc.5-era source:
          #   - PromptPresentation lost the `tools` property
          #     (src/delegation-guidance.ts reads assembly.tools),
          #   - CodeRunFailedError moved to the new
          #     @deepseek-ai/dsh-tool-executor-ptc (src/ptc/runner.ts imports
          #     it from @deepseek-ai/dsh-tools),
          #   - @deepseek-ai/dsh-plan-mode@0.2.2-rc.1 is 404 on the registry
          #     (the package tops out at 0.2.2-alpha.3), so the full 0.2.2
          #     tower cannot even be installed locally to stage a migration
          #     patch.
          # Policy: an upstream incident is turned green in the same round by
          # pinning the closure supply to the last COMPLETE published wave.
          # Follow-up (CHANGELOG "Unreleased"): once the 0.2.2 wave completes
          # and the source is adapted, restore the rolling newest-of(latest,next)
          # resolution (recoverable from this file's git history) and ride the
          # wave again.
          DSH_VERSION="0.2.1-rc.5"
          # Same wave-pinned closure install as before: the pinned version's
          # own @deepseek-ai/* ranges are clamped to their base versions via
          # npm overrides, so tilde/caret ranges cannot float into another
          # tower (the ^0.1.5-rc.2 float trap on record).
          DSH_DIR="${RUNNER_TEMP:-/tmp}/dsh-cli-install"
          install_dsh() {
            local ver="$1" dir="$2"
            node -e '
              const { execFileSync } = require("node:child_process")
              const { writeFileSync, mkdirSync } = require("node:fs")
              const [ver, dir] = process.argv.slice(1)
              const deps = JSON.parse(execFileSync("npm", ["view", `@deepseek-ai/dsh@${ver}`, "dependencies", "--json"], { encoding: "utf8" }))
              const overrides = {}
              for (const [name, range] of Object.entries(deps ?? {})) {
                if (name.startsWith("@deepseek-ai/") && /^[~^]/.test(range)) overrides[name] = range.replace(/^[~^]/, "")
              }
              mkdirSync(dir, { recursive: true })
              writeFileSync(`${dir}/package.json`, JSON.stringify({
                name: "dsh-ci-install",
                private: true,
                dependencies: { "@deepseek-ai/dsh": ver },
                overrides,
              }, null, 2))
            ' "$ver" "$dir"
            (cd "$dir" && npm install --no-audit --no-fund >/dev/null)
          }
          echo "dsh closure: ${DSH_VERSION} (pinned)"
          if ! install_dsh "$DSH_VERSION" "$DSH_DIR"; then
            echo "::error:: pinned closure wave dsh@${DSH_VERSION} won't install — the wave left the registry; re-pin to the next complete wave"
            exit 1
          fi
          # Later steps (link-dsh-closure, boot smoke) use the scratch CLI.
          echo "${DSH_DIR}/node_modules/.bin" >> "$GITHUB_PATH"
          echo "DSH_CLOSURE_DIR=${DSH_DIR}/node_modules/@deepseek-ai" >> "$GITHUB_ENV"

      - name: Link @deepseek-ai/* to the dsh closure
        run: node scripts/link-dsh-closure.mjs

      - name: Build
        run: pnpm build

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
