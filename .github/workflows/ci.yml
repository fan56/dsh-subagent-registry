# CI: build, typecheck, unit suite on Node 22/24, plus a real-host boot smoke
# — on every push to main, every pull request, and a daily schedule.
#
# The @deepseek-ai/* devDeps are pinned exactly to 0.1.7-rc.1 so installs
# resolve a real published surface, but typecheck/tests run against the GLOBAL
# dsh CLI's own closure (scripts/link-dsh-closure.mjs re-points every
# @deepseek-ai/* at it) — one cordis in the type graph, and the gate tracks
# the rolling rc/stable line the same way the running host does. The smoke job
# boots a scratch profile with the plugin mounted via the real dsh CLI
# (scripts/smoke-boot.mjs) so "loads under real cordis" is a gate, not a hope.
#
# The daily schedule is the rolling early-warning: an rc/stable-line drift
# that breaks this plugin turns the scheduled run red without anyone
# re-pinning.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily 02:37 UTC — catches upstream dsh rc/stable drift without hand-chasing.
    - cron: '37 2 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & Test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # The shipped engines floor plus current LTS.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm-lock.yaml is committed and MUST be regenerated in the same
          # commit as any package.json change — CI installs frozen and fails
          # fast otherwise (the dsh-tui-pi v1.0.5 lesson).
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (rolling rc/stable line — newest of latest/next, never alpha; wave-pinned closure, falls back to the other tag)
        run: |
          # Policy (2026-09-03): the alpha line is retired for CI. Resolve the
          # newest of the `latest` (stable) and `next` (rc) dist-tags at
          # runtime, never hand-pinned — when a stable 0.1.2+ lands on
          # `latest` it wins over the rc by plain semver compare.
          STABLE="$(npm view @deepseek-ai/dsh@latest version)"
          RC="$(npm view @deepseek-ai/dsh@next version 2>/dev/null || true)"
          DSH_VERSION="$STABLE"
          if [ -n "$RC" ] && [ "$(printf '%s\n' "$STABLE" "$RC" | sort -V | tail -1)" = "$RC" ]; then
            DSH_VERSION="$RC"
          fi
          # The install goes into a scratch prefix as the publish wave's OWN
          # closure: every @deepseek-ai/* range the resolved version declares
          # is pinned to its base version via npm overrides. A plain
          # `npm install -g dsh@$VER` is not resilient enough:
          # 1. a caret range like ^0.1.5-rc.2 FLOATS to a newer prerelease in
          #    the same tower, so one incomplete upstream wave (next=0.1.5-rc.3
          #    shipped without dsh-client-ui-sidebar-documentpreview@rc.3)
          #    poisons fresh installs of the OLDER, complete version too;
          # 2. a wave with missing base versions fails HERE — instead of
          #    redding CI on upstream's breakage — and falls back to the other
          #    dist-tag; both ends uninstallable stays red (a real signal).
          ALT=""
          if [ "$DSH_VERSION" != "$STABLE" ]; then
            ALT="$STABLE"
          elif [ -n "$RC" ] && [ "$RC" != "$DSH_VERSION" ]; then
            ALT="$RC"
          fi
          DSH_DIR="${RUNNER_TEMP:-/tmp}/dsh-cli-install"
          install_dsh() {
            local ver="$1" dir="$2"
            node -e '
              const { execFileSync } = require("node:child_process")
              const { writeFileSync, mkdirSync } = require("node:fs")
              const [ver, dir] = process.argv.slice(1)
              const deps = JSON.parse(execFileSync("npm", ["view", `@deepseek-ai/dsh@${ver}`, "dependencies", "--json"], { encoding: "utf8" }))
              const overrides = {}
              for (const [name, range] of Object.entries(deps ?? {})) {
                if (name.startsWith("@deepseek-ai/") && /^[~^]/.test(range)) overrides[name] = range.replace(/^[~^]/, "")
              }
              mkdirSync(dir, { recursive: true })
              writeFileSync(`${dir}/package.json`, JSON.stringify({
                name: "dsh-ci-install",
                private: true,
                dependencies: { "@deepseek-ai/dsh": ver },
                overrides,
              }, null, 2))
            ' "$ver" "$dir"
            (cd "$dir" && npm install --no-audit --no-fund >/dev/null)
          }
          echo "dsh closure: ${DSH_VERSION}"
          if ! install_dsh "$DSH_VERSION" "$DSH_DIR"; then
            if [ -z "$ALT" ]; then
              echo "::error:: dsh@${DSH_VERSION} won't install and there is no other dist-tag to fall back to"
              exit 1
            fi
            echo "::warning:: dsh@${DSH_VERSION} won't install (incomplete upstream publish wave?) — falling back to ${ALT}"
            DSH_DIR="${RUNNER_TEMP:-/tmp}/dsh-cli-install-fallback"
            install_dsh "$ALT" "$DSH_DIR" || { echo "::error:: neither ${DSH_VERSION} nor ${ALT} installs"; exit 1; }
          fi
          # Later steps (link-dsh-closure, boot smoke) use the scratch CLI.
          echo "${DSH_DIR}/node_modules/.bin" >> "$GITHUB_PATH"
          echo "DSH_CLOSURE_DIR=${DSH_DIR}/node_modules/@deepseek-ai" >> "$GITHUB_ENV"

      # Re-point every @deepseek-ai/* at the CLI's own closure so typecheck
      # and the unit suite see exactly one copy of each host package.
      - name: Link @deepseek-ai/* to the dsh closure
        run: node scripts/link-dsh-closure.mjs

      # Tests import lib/ and there is no pretest hook, so build explicitly.
      - name: Build
        run: pnpm build

      - name: Check
        run: pnpm check

      - name: Test
        run: pnpm test

  smoke:
    name: Boot smoke (real dsh host)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install dsh CLI (rolling rc/stable line — newest of latest/next, never alpha; wave-pinned closure, falls back to the other tag)
        run: |
          # Policy (2026-09-03): the alpha line is retired for CI. Resolve the
          # newest of the `latest` (stable) and `next` (rc) dist-tags at
          # runtime, never hand-pinned — when a stable 0.1.2+ lands on
          # `latest` it wins over the rc by plain semver compare.
          STABLE="$(npm view @deepseek-ai/dsh@latest version)"
          RC="$(npm view @deepseek-ai/dsh@next version 2>/dev/null || true)"
          DSH_VERSION="$STABLE"
          if [ -n "$RC" ] && [ "$(printf '%s\n' "$STABLE" "$RC" | sort -V | tail -1)" = "$RC" ]; then
            DSH_VERSION="$RC"
          fi
          # The install goes into a scratch prefix as the publish wave's OWN
          # closure: every @deepseek-ai/* range the resolved version declares
          # is pinned to its base version via npm overrides. A plain
          # `npm install -g dsh@$VER` is not resilient enough:
          # 1. a caret range like ^0.1.5-rc.2 FLOATS to a newer prerelease in
          #    the same tower, so one incomplete upstream wave (next=0.1.5-rc.3
          #    shipped without dsh-client-ui-sidebar-documentpreview@rc.3)
          #    poisons fresh installs of the OLDER, complete version too;
          # 2. a wave with missing base versions fails HERE — instead of
          #    redding CI on upstream's breakage — and falls back to the other
          #    dist-tag; both ends uninstallable stays red (a real signal).
          ALT=""
          if [ "$DSH_VERSION" != "$STABLE" ]; then
            ALT="$STABLE"
          elif [ -n "$RC" ] && [ "$RC" != "$DSH_VERSION" ]; then
            ALT="$RC"
          fi
          DSH_DIR="${RUNNER_TEMP:-/tmp}/dsh-cli-install"
          install_dsh() {
            local ver="$1" dir="$2"
            node -e '
              const { execFileSync } = require("node:child_process")
              const { writeFileSync, mkdirSync } = require("node:fs")
              const [ver, dir] = process.argv.slice(1)
              const deps = JSON.parse(execFileSync("npm", ["view", `@deepseek-ai/dsh@${ver}`, "dependencies", "--json"], { encoding: "utf8" }))
              const overrides = {}
              for (const [name, range] of Object.entries(deps ?? {})) {
                if (name.startsWith("@deepseek-ai/") && /^[~^]/.test(range)) overrides[name] = range.replace(/^[~^]/, "")
              }
              mkdirSync(dir, { recursive: true })
              writeFileSync(`${dir}/package.json`, JSON.stringify({
                name: "dsh-ci-install",
                private: true,
                dependencies: { "@deepseek-ai/dsh": ver },
                overrides,
              }, null, 2))
            ' "$ver" "$dir"
            (cd "$dir" && npm install --no-audit --no-fund >/dev/null)
          }
          echo "dsh closure: ${DSH_VERSION}"
          if ! install_dsh "$DSH_VERSION" "$DSH_DIR"; then
            if [ -z "$ALT" ]; then
              echo "::error:: dsh@${DSH_VERSION} won't install and there is no other dist-tag to fall back to"
              exit 1
            fi
            echo "::warning:: dsh@${DSH_VERSION} won't install (incomplete upstream publish wave?) — falling back to ${ALT}"
            DSH_DIR="${RUNNER_TEMP:-/tmp}/dsh-cli-install-fallback"
            install_dsh "$ALT" "$DSH_DIR" || { echo "::error:: neither ${DSH_VERSION} nor ${ALT} installs"; exit 1; }
          fi
          # Later steps (link-dsh-closure, boot smoke) use the scratch CLI.
          echo "${DSH_DIR}/node_modules/.bin" >> "$GITHUB_PATH"
          echo "DSH_CLOSURE_DIR=${DSH_DIR}/node_modules/@deepseek-ai" >> "$GITHUB_ENV"

      - name: Link @deepseek-ai/* to the dsh closure
        run: node scripts/link-dsh-closure.mjs

      - name: Build
        run: pnpm build

      - name: Boot smoke (real dsh host, scratch profile)
        run: node scripts/smoke-boot.mjs
