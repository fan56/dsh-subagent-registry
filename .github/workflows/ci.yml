          # ranks an rc ABOVE the same-version stable, so once a stable lands
          # on `latest` sort -V would pick the older rc).
          # History: newest-of(latest,next) restored 2026-10-17 for the 0.2.1
          # line; suspended 2026-11-04 by the incident pin (0.2.2-rc.1 wave
          # then incomplete and breaking for the un-adapted source);
          # restored 2026-11-05 after the 0.2.2-rc.1 adaptation landed (see
          # the file header and CHANGELOG "Unreleased").
