# Weekly install-integration e2e: the assertions in
# e2e/podman-install/entry.sh run BARE on the runner (no podman needed on
# Linux — the Containerfile is only the purification chamber for local mac
# runs). This is the rolling gate for the #2 packaging class: a published
# tarball whose postinstall target goes missing, a closure linker that starts
# running in consumer trees, or a host that stops composing/booting the
# released plugins all turn this red without anyone re-running anything.
#
# Plugin versions resolve LIVE from the official registry at run time (with
# fix-version floors), so the suite always tests what users install today.
# The dsh HOST is pinned for now: 2026-11-04 incident pin — upstream `next`
# (0.2.2-rc.1) shipped an incomplete wave (@deepseek-ai/dsh-plan-mode@
# 0.2.2-rc.1 is 404) that breaks this 0.2.1-rc.5-era plugin. See the install
# step below and CHANGELOG "Unreleased" for the ride-the-0.2.2-wave follow-up.
name: e2e install

on:
  schedule:
    # Weekly Monday 05:23 UTC — off-peak, catches drift without hand-running.
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-integration:
    name: Published-tarball install integration
    # Pinned ubuntu-24.04 (not ubuntu-latest) to dodge podman/runner-image
    # breakage history; this job doesn't even use podman, but the pin also
    # keeps node/timeout semantics stable.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the dsh CLI (PINNED 0.2.1-rc.5 wave — 2026-11-04 incident pin)
        run: |
          # 2026-11-04 incident pin (suspends the rolling next-or-latest,
          # prerelease-aware resolution): upstream `next` = 0.2.2-rc.1 shipped
          # an incomplete wave — @deepseek-ai/dsh-plan-mode@0.2.2-rc.1 is 404
          # on the registry, PromptPresentation lost the `tools` property, and
          # CodeRunFailedError moved to @deepseek-ai/dsh-tool-executor-ptc —
          # which breaks this 0.2.1-rc.5-era plugin. Pin the host to the last
          # complete wave; restore the rolling resolution once the 0.2.2 wave
          # completes and the source is adapted (CHANGELOG "Unreleased";
          # previous step body recoverable from this file's git history).
          V="0.2.1-rc.5"
          echo "host dsh: $V (pinned — rolling next-or-latest suspended)"
          npm install -g --no-fund --no-audit "@deepseek-ai/dsh@$V"
          dsh --version

      - name: Run the install-integration suite
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          mkdir -p "$DSH_HOME/profiles"
          bash e2e/podman-install/entry.sh
